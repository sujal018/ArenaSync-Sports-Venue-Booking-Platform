spring.application.name=turf_backend

#DB config
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/turf_booking_db3?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# FIX: ddl-auto=create was here, meaning EVERY restart dropped and
# recreated all tables, wiping all data (users, bookings, payments, ...).
# 'update' preserves existing data across restarts. For real production
# use, replace this with Flyway/Liquibase managed migrations instead.
spring.jpa.hibernate.ddl-auto=update

#default server port 8080
#server.port=9090

#JWT secret key
# FIX: this was a hardcoded secret committed to source control.
# Set the JWT_SECRET environment variable in real deployments; the value
# below is only a local-dev fallback so the app still runs out of the box.
jwt.secret.key=${JWT_SECRET:3622956d82a85ff1683c198ac0d9c27a41076f514765056559ead3f385c19127}
#JWT expiratoin time in msec (2 hours=7200000)
jwt.expiration.time=7200000


# Payment Scheduler
payment.expiry.minutes=5
payment.scheduler.fixed-delay=60000

# payment-service base URL, used by PaymentFeignClient
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8081}


# Turned off by default: this dumps full auth internals (including
# processed JWTs) to the console on every request. Fine to flip on
# temporarily while debugging, but noisy/leaky to leave on always.
logging.level.org.springframework.security=INFO
# Increase Spring Boot file upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB